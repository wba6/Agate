name: Build Debug and Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 5' # Runs every Friday at 6 PM UTC
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build on ${{ matrix.os }} - ${{ matrix.config }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: true          # Checkout submodules
        fetch-depth: 0            # Ensure the full history is fetched

    - name: Install dependencies on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev xorg-dev

    - name: Install dependencies on macos
      if: runner.os == 'macos'
      run: |
        brew install --quiet ninja gcc
        export CC=gcc-13
        export CXX=g++-13

    - name: Install CMake on Windows
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress
        choco install ninja --no-progress
      
    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.config }} -G Ninja -DCMAKE_CXX_FLAGS="-Wno-error=array-bounds" -DCMAKE_C_FLAGS="-Wno-error=unknown-pragmas"

    - name: Build with CMake
      run: cmake --build build --config ${{ matrix.config }}

    - name: Post build actions
      if: always()
      run: |
        echo "Build finished with ${{ matrix.config }} configuration on ${{ matrix.os }}."
